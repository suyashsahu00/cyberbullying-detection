[project]
name = "cyberbullying-detection"
version = "0.1.0"
description = "NLP-powered Cyberbullying Detection Tool with Explainability & Multilingual (English/Hinglish) Support"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.42.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
]
